<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#3b82f6">
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/web/favicon.ico">
  <title>Key 使用情况</title>
  <script src="/web/assets/js/theme-init.js?v=__VERSION__"></script>
  <link rel="stylesheet" href="/web/assets/css/styles.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/assets/css/key-usage.css?v=__VERSION__">
  <link rel="stylesheet" href="/web/theme.css?v=__VERSION__">
  <script defer src="/web/assets/js/echarts.min.js?v=__VERSION__"></script>
  <script defer src="/web/assets/js/key-usage.js?v=__VERSION__"></script>
</head>
<body>
  <main class="public-usage-page">
    <header class="public-usage-header">
      <div>
        <h1>Key 使用情况</h1>
        <p id="updatedAt" class="public-usage-updated">--</p>
      </div>
      <button id="refreshButton" class="public-usage-refresh" type="button" title="刷新" aria-label="刷新">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M20 6V10H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18V14H8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.49 9A7 7 0 0 0 6.64 6.64L4 10M20 14L17.36 17.36A7 7 0 0 1 5.51 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="public-usage-section" aria-labelledby="todayTitle">
      <div class="public-usage-section-heading">
        <h2 id="todayTitle">今日实时</h2>
        <span class="public-usage-live">实时</span>
      </div>
      <dl id="todayMetrics" class="public-usage-metrics"></dl>
    </section>

    <section class="public-usage-section" aria-labelledby="modelShareTitle">
      <div class="public-usage-section-heading">
        <h2 id="modelShareTitle">今日模型占比</h2>
      </div>
      <div class="public-usage-pie-grid">
        <article class="public-usage-pie-panel" aria-labelledby="modelTokenTitle">
          <h3 id="modelTokenTitle">Token 占比</h3>
          <div id="modelTokenChart" class="public-usage-pie-chart" role="img" aria-label="今日不同模型的 Token 消耗占比饼图"></div>
        </article>
        <article class="public-usage-pie-panel" aria-labelledby="modelCostTitle">
          <h3 id="modelCostTitle">费用占比</h3>
          <div id="modelCostChart" class="public-usage-pie-chart" role="img" aria-label="今日不同模型的费用占比饼图"></div>
        </article>
      </div>
    </section>

    <section class="public-usage-section public-usage-chart-section" aria-labelledby="trendTitle">
      <div class="public-usage-section-heading">
        <h2 id="trendTitle">今日用量趋势</h2>
      </div>
      <div id="usageChart" class="public-usage-chart" role="img" aria-label="今日费用和 Token 使用趋势图"></div>
    </section>
  </main>
</body>
</html>
